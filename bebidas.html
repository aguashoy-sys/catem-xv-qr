<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CATEM XV AÑOS - Comida</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
    }

    .catem {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    .xv {
      color: #7b1f32;
      font-size: 22px;
      font-weight: bold;
    }

    .titulo {
      margin-top: 22px;
      font-size: 21px;
      font-weight: 900;
    }

    .modulo-actual {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 900;
      color: #7b1f32;
    }

    .boton-escanear {
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #7b1f32;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .manual {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
    }

    .boton-manual {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      display: none;
      margin-top: 25px;
      padding: 25px 15px;
      border-radius: 15px;
    }

    .correcto {
      background: #e9f7ef;
      border: 3px solid #28a745;
    }

    .rechazado {
      background: #fdecec;
      border: 3px solid #dc3545;
    }

    .estado {
      font-size: 27px;
      font-weight: 900;
    }

    .nombre {
      font-size: 24px;
      font-weight: 900;
      margin-top: 18px;
    }

    .empresa {
      font-size: 18px;
      margin-top: 5px;
    }

    .disponibles {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    .numero-disponibles {
      font-size: 52px;
      font-weight: 900;
      margin-top: 5px;
    }

    .pregunta {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .botones-cantidad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .boton-cantidad {
      padding: 20px 5px;
      border: none;
      border-radius: 12px;
      background: #7b1f32;
      color: white;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
    }

    .boton-cantidad:disabled {
      opacity: .5;
    }

    .siguiente {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 30px;
      color: #7b1f32;
      font-style: italic;
      font-weight: bold;
    }

  </style>
</head>


<body>

<div class="contenedor">

  <div class="catem">
    CATEM
  </div>

  <div class="xv">
    — XV AÑOS —
  </div>

  <div class="titulo">
    🍽️ MÓDULO DE COMIDA
  </div>

  <div
    class="modulo-actual"
    id="moduloActual">
  </div>


  <button
    class="boton-escanear"
    onclick="iniciarScanner()">

    📷 ESCANEAR QR

  </button>


  <div id="reader"></div>


  <div class="manual">

    <input
      id="qrManual"
      placeholder="CATEM-00001">

    <button
      class="boton-manual"
      onclick="validarManual()">

      VALIDAR MANUALMENTE

    </button>

  </div>


  <div id="resultado"></div>


  <div class="footer">
    Juntos hacemos más
  </div>

</div>


<script>


// ======================================================
// CONFIGURACIÓN
// ======================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycby9w6dVDOKHskXgvt28-usSj3QfylFlmm4SqhanNHLJcjQRmQ2FPdDoJiVMejc6LgkKfw/exec";


// ======================================================
// LEER MÓDULO DESDE LA URL
//
// comida.html?modulo=1
// ======================================================

const parametros =
  new URLSearchParams(
    window.location.search
  );

let MODULO =
  Number(
    parametros.get("modulo")
  );

if (
  !MODULO ||
  MODULO < 1 ||
  MODULO > 5
) {

  MODULO = 1;

}


document
  .getElementById("moduloActual")
  .innerHTML =
  "MÓDULO " +
  MODULO;


let scanner = null;

let procesando = false;

let qrActual = "";


// ======================================================
// INICIAR SCANNER
// ======================================================

async function iniciarScanner() {


  procesando = false;

  qrActual = "";


  document
    .getElementById("resultado")
    .style.display =
    "none";


  document
    .getElementById("reader")
    .style.display =
    "block";


  try {


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      async function(texto) {


        if (procesando) {
          return;
        }


        procesando = true;


        try {

          await scanner.stop();

        } catch (e) {}


        document
          .getElementById("reader")
          .style.display =
          "none";


        consultarQR(
          texto.trim()
        );

      },

      function(error) {

        // Ignoramos errores normales
        // mientras busca el QR.

      }

    );


  } catch (error) {


    alert(
      "No se pudo iniciar la cámara. " +
      "Verifica el permiso de cámara."
    );

  }

}


// ======================================================
// VALIDACIÓN MANUAL
// ======================================================

function validarManual() {


  const qr =
    document
      .getElementById(
        "qrManual"
      )
      .value
      .trim();


  if (!qr) {

    alert(
      "Escribe un código QR."
    );

    return;
  }


  consultarQR(qr);

}


// ======================================================
// CONSULTAR COMIDAS
// ======================================================

async function consultarQR(qr) {


  qrActual = qr;


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.style.display =
    "block";


  resultado.className = "";


  resultado.innerHTML =

    "<div class='estado'>" +
    "VALIDANDO..." +
    "</div>";


  try {


    const respuesta =
      await fetch(

        API_URL,

        {

          method: "POST",

          body: JSON.stringify({

            accion:
              "consultarComidas",

            qr:
              qr,

            modulo:
              MODULO

          })

        }

      );


    const datos =
      await respuesta.json();


    mostrarConsulta(
      datos
    );


  } catch (error) {


    resultado.className =
      "rechazado";


    resultado.innerHTML =

      "<div class='estado'>" +
      "⚠️ ERROR DE CONEXIÓN" +
      "</div>" +

      botonSiguiente();

  }

}


// ======================================================
// MOSTRAR CONSULTA
// ======================================================

function mostrarConsulta(datos) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  // ==============================================
  // RECHAZADO
  // ==============================================

  if (!datos.autorizado) {


    resultado.className =
      "rechazado";


    resultado.innerHTML =


      "<div class='estado'>" +

      "⛔ " +
      datos.mensaje +

      "</div>" +


      (
        datos.nombre

        ?

        "<div class='nombre'>" +
        datos.nombre +
        "</div>"

        :

        ""
      ) +


      (
        datos.empresa

        ?

        "<div class='empresa'>" +
        datos.empresa +
        "</div>"

        :

        ""
      ) +


      (
        datos.comidasDisponibles !==
        undefined

        ?

        "<div class='disponibles'>" +
        "COMIDAS DISPONIBLES" +
        "</div>" +

        "<div class='numero-disponibles'>" +
        datos.comidasDisponibles +
        "</div>"

        :

        ""
      ) +


      botonSiguiente();


    return;

  }


  // ==============================================
  // AUTORIZADO
  // ==============================================


  resultado.className =
    "correcto";


  const disponibles =
    Number(
      datos.comidasDisponibles
    );


  let botones = "";


  for (
    let i = 1;
    i <= disponibles;
    i++
  ) {


    botones +=

      "<button " +

      "class='boton-cantidad' " +

      "onclick='entregarComidas(" +
      i +
      ")'>" +

      i +

      "</button>";

  }


  resultado.innerHTML =


    "<div class='estado'>" +
    "✅ QR VÁLIDO" +
    "</div>" +


    "<div class='nombre'>" +
    datos.nombre +
    "</div>" +


    "<div class='empresa'>" +
    datos.empresa +
    "</div>" +


    "<div class='disponibles'>" +
    "COMIDAS DISPONIBLES" +
    "</div>" +


    "<div class='numero-disponibles'>" +
    disponibles +
    "</div>" +


    "<div class='pregunta'>" +
    "¿Cuántas comidas se entregan?" +
    "</div>" +


    "<div class='botones-cantidad'>" +
    botones +
    "</div>";

}


// ======================================================
// ENTREGAR COMIDAS
// ======================================================

async function entregarComidas(
  cantidad
) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  // Evitar doble toque

  const botones =
    document.querySelectorAll(
      ".boton-cantidad"
    );


  botones.forEach(
    boton =>
      boton.disabled = true
  );


  resultado.insertAdjacentHTML(

    "beforeend",

    "<div id='procesandoEntrega' " +
    "style='margin-top:20px;font-weight:bold;'>" +

    "REGISTRANDO ENTREGA..." +

    "</div>"

  );


  try {


    const respuesta =
      await fetch(

        API_URL,

        {

          method: "POST",

          body: JSON.stringify({

            accion:
              "registrarComidas",

            qr:
              qrActual,

            modulo:
              MODULO,

            cantidad:
              cantidad

          })

        }

      );


    const datos =
      await respuesta.json();


    mostrarEntrega(
      datos
    );


  } catch (error) {


    resultado.className =
      "rechazado";


    resultado.innerHTML =

      "<div class='estado'>" +
      "⚠️ ERROR DE CONEXIÓN" +
      "</div>" +

      "<div>" +
      "No se registró la entrega." +
      "</div>" +

      botonSiguiente();

  }

}


// ======================================================
// RESULTADO DE ENTREGA
// ======================================================

function mostrarEntrega(datos) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  if (datos.autorizado) {


    resultado.className =
      "correcto";


    resultado.innerHTML =


      "<div class='estado'>" +
      "✅ ENTREGA REGISTRADA" +
      "</div>" +


      "<div class='nombre'>" +

      datos.cantidadEntregada +

      (
        datos.cantidadEntregada == 1

        ? " COMIDA ENTREGADA"

        : " COMIDAS ENTREGADAS"
      ) +

      "</div>" +


      "<div class='disponibles'>" +
      "COMIDAS RESTANTES" +
      "</div>" +


      "<div class='numero-disponibles'>" +
      datos.comidasDisponibles +
      "</div>" +


      botonSiguiente();


  } else {


    resultado.className =
      "rechazado";


    resultado.innerHTML =


      "<div class='estado'>" +

      "⛔ " +
      datos.mensaje +

      "</div>" +


      (
        datos.comidasDisponibles !==
        undefined

        ?

        "<div class='disponibles'>" +

        "DISPONIBLES: " +
        datos.comidasDisponibles +

        "</div>"

        :

        ""
      ) +


      botonSiguiente();

  }

}


// ======================================================
// SIGUIENTE PERSONA
// ======================================================

function botonSiguiente() {


  return (

    "<button " +

    "class='siguiente' " +

    "onclick='siguientePersona()'>" +

    "SIGUIENTE PERSONA →" +

    "</button>"

  );

}


function siguientePersona() {


  document
    .getElementById(
      "resultado"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "qrManual"
    )
    .value =
    "";


  qrActual = "";


  iniciarScanner();

}


</script>

</body>
</html>
