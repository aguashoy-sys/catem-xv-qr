<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CATEM XV AÑOS</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222222;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
    }

    .catem {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    .xv {
      color: #7b1f32;
      font-size: 22px;
      font-weight: bold;
      margin-top: 3px;
    }

    .titulo {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .boton-escanear {
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #7b1f32;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .manual {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #dddddd;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
    }

    .boton-manual {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #333333;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      display: none;
      margin-top: 25px;
      padding: 25px 15px;
      border-radius: 15px;
    }

    .autorizado {
      background: #e9f7ef;
      border: 3px solid #28a745;
    }

    .rechazado {
      background: #fdecec;
      border: 3px solid #dc3545;
    }

    .estado {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .nombre {
      font-size: 24px;
      font-weight: 900;
      margin-top: 10px;
    }

    .empresa {
      font-size: 18px;
      margin-top: 5px;
    }

    .pulsera {
      margin-top: 25px;
      padding: 22px 10px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 900;
    }

    .modulo {
      font-size: 22px;
      font-weight: bold;
      margin-top: 12px;
    }

    .siguiente {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 10px;
      background: #222222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .qrtexto {
      margin-top: 15px;
      font-size: 14px;
      color: #777777;
    }

    .footer {
      margin-top: 30px;
      color: #7b1f32;
      font-style: italic;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <div class="catem">
    CATEM
  </div>

  <div class="xv">
    — XV AÑOS —
  </div>

  <div class="titulo">
    MÓDULO DE RECEPCIÓN
  </div>


  <button
    class="boton-escanear"
    onclick="iniciarScanner()">

    📷 ESCANEAR QR

  </button>


  <div id="reader"></div>


  <div class="manual">

    <input
      id="qrManual"
      placeholder="CATEM-00001">

    <button
      class="boton-manual"
      onclick="validarManual()">

      VALIDAR MANUALMENTE

    </button>

  </div>


  <div id="resultado"></div>


  <div class="footer">
    Juntos hacemos más
  </div>

</div>



<script>


// ======================================================
// CONFIGURACIÓN
// ======================================================


// IMPORTANTE:
// Sustituye solamente lo que está entre comillas
// por tu URL real de Apps Script.

const API_URL =
  "https://script.google.com/macros/s/AKfycby9w6dVDOKHskXgvt28-usSj3QfylFlmm4SqhanNHLJcjQRmQ2FPdDoJiVMejc6LgkKfw/exec";


const MODULO =
  "RECEPCIÓN 1";



let scanner = null;

let procesando = false;



// ======================================================
// INICIAR CÁMARA
// ======================================================

async function iniciarScanner() {


  procesando = false;


  document
    .getElementById("resultado")
    .style.display =
    "none";


  document
    .getElementById("reader")
    .style.display =
    "block";


  try {


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(


      {
        facingMode:
          "environment"
      },


      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      async function(texto) {


        if (procesando) {
          return;
        }


        procesando = true;


        try {

          await scanner.stop();

        } catch (e) {}


        document
          .getElementById("reader")
          .style.display =
          "none";


        validarQR(
          texto.trim()
        );

      },


      function(error) {

        // Los errores normales
        // de lectura se ignoran.

      }

    );


  } catch (error) {


    alert(
      "No se pudo iniciar la cámara. " +
      "Verifica que Chrome tenga permiso para utilizarla."
    );

  }

}



// ======================================================
// VALIDACIÓN MANUAL
// ======================================================

function validarManual() {


  const qr =
    document
      .getElementById("qrManual")
      .value
      .trim();


  if (!qr) {


    alert(
      "Escribe un código QR."
    );


    return;

  }


  validarQR(qr);

}



// ======================================================
// ENVIAR QR AL SISTEMA
// ======================================================

async function validarQR(qr) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className = "";

  resultado.style.display =
    "block";


  resultado.innerHTML =
    "<div class='estado'>" +
    "VALIDANDO..." +
    "</div>";


  try {


    const respuesta =
      await fetch(

        API_URL,

        {

          method: "POST",

          body: JSON.stringify({

            qr: qr,

            modulo: MODULO

          })

        }

      );


    const datos =
      await respuesta.json();


    mostrarResultado(
      datos,
      qr
    );


  } catch (error) {


    resultado.className =
      "rechazado";


    resultado.innerHTML =

      "<div class='estado'>" +
      "⚠️ ERROR DE CONEXIÓN" +
      "</div>" +

      "<div>" +
      "No fue posible comunicarse con el sistema." +
      "</div>" +

      botonSiguiente();

  }

}



// ======================================================
// MOSTRAR RESULTADO
// ======================================================

function mostrarResultado(
  datos,
  qr
) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  if (datos.autorizado) {


    resultado.className =
      "autorizado";


    const numero =
      datos.moduloBebida;


    const color =
      datos.colorPulsera;


    const estiloPulsera =
      obtenerEstiloColor(
        color
      );


    resultado.innerHTML =


      "<div class='estado'>" +
      "✅ ACCESO AUTORIZADO" +
      "</div>" +


      "<div class='nombre'>" +
      datos.nombre +
      "</div>" +


      "<div class='empresa'>" +
      datos.empresa +
      "</div>" +


      "<div class='pulsera' " +
      "style='" +
      estiloPulsera +
      "'>" +

      "PULSERA " +
      color +

      "</div>" +


      "<div class='modulo'>" +

      "🥤 BEBIDAS — MÓDULO " +
      numero +

      "</div>" +


      "<div class='qrtexto'>" +
      qr +
      "</div>" +


      botonSiguiente();


  } else {


    resultado.className =
      "rechazado";


    resultado.innerHTML =


      "<div class='estado'>" +
      "⛔ " +
      datos.mensaje +
      "</div>" +


      (
        datos.nombre

        ?

        "<div class='nombre'>" +
        datos.nombre +
        "</div>"

        :

        ""
      ) +


      (
        datos.empresa

        ?

        "<div class='empresa'>" +
        datos.empresa +
        "</div>"

        :

        ""
      ) +


      "<div class='qrtexto'>" +
      qr +
      "</div>" +


      botonSiguiente();

  }

}



// ======================================================
// COLOR VISUAL DE PULSERA
// ======================================================

function obtenerEstiloColor(
  color
) {


  switch (color) {


    case "ROJO":

      return (
        "background:#d32f2f;" +
        "color:white;"
      );


    case "AZUL":

      return (
        "background:#1976d2;" +
        "color:white;"
      );


    case "VERDE":

      return (
        "background:#388e3c;" +
        "color:white;"
      );


    case "AMARILLO":

      return (
        "background:#fbc02d;" +
        "color:#222;"
      );


    case "MORADO":

      return (
        "background:#7b1fa2;" +
        "color:white;"
      );


    default:

      return (
        "background:#eeeeee;" +
        "color:#222;"
      );

  }

}



// ======================================================
// BOTÓN SIGUIENTE PERSONA
// ======================================================

function botonSiguiente() {


  return (

    "<button " +
    "class='siguiente' " +
    "onclick='siguientePersona()'>" +

    "SIGUIENTE PERSONA →" +

    "</button>"

  );

}



// ======================================================
// PREPARAR SIGUIENTE ESCANEO
// ======================================================

function siguientePersona() {


  document
    .getElementById(
      "resultado"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "qrManual"
    )
    .value =
    "";


  iniciarScanner();

}


</script>


</body>

</html>
